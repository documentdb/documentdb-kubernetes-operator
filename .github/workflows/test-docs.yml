name: Documentation Tests

on:
  pull_request:
    paths:
      - README.md
      - mkdocs.yml
      - 'docs/operator-public-documentation/**'
      - 'docs/overrides/**'
      - '.github/scripts/check_doc_*.py'
      - '.github/workflows/*docs.yml'
  push:
    branches: [main]
    paths:
      - README.md
      - mkdocs.yml
      - 'docs/operator-public-documentation/**'
      - 'docs/overrides/**'
      - '.github/scripts/check_doc_*.py'
      - '.github/workflows/*docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Install documentation dependencies
        run: pip install "mkdocs-material==9.5.19" "mike==2.1.3" "mkdocs-redirects==1.2.2"
      - name: Test link checker
        run: python -m unittest discover -s .github/scripts -p '*_test.py'
      - name: Build and check candidate entrypoints
        env:
          MIKE_DOCS_VERSION: dev
        run: |
          mkdocs build
          python .github/scripts/check_doc_links.py --site-dir site
      - name: Check README links against released documentation
        run: python .github/scripts/check_doc_links.py
