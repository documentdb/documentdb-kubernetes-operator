# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: proxy secret
templates:
  - 08_proxy_secret.yaml
tests:
  - it: should not render the proxy Secret when proxy is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render the proxy Secret with routing keys when enabled
    set:
      Azure.proxySettings.isProxyEnabled: true
      Azure.proxySettings.httpProxy: "http://proxy.example.com:3128"
      Azure.proxySettings.httpsProxy: "http://proxy.example.com:3128"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: documentdb-proxy-config
      - equal:
          path: metadata.namespace
          value: documentdb-operator
      - equal:
          path: stringData.HTTP_PROXY
          value: "http://proxy.example.com:3128"
      - equal:
          path: stringData.HTTPS_PROXY
          value: "http://proxy.example.com:3128"

  - it: should always append in-cluster bypass entries to NO_PROXY
    set:
      Azure.proxySettings.isProxyEnabled: true
      Azure.proxySettings.noProxy: "example.internal"
    asserts:
      - matchRegex:
          path: stringData.NO_PROXY
          pattern: "^example.internal,localhost,127.0.0.1,.*\\.svc\\.cluster\\.local.*192.168.0.0/16$"
