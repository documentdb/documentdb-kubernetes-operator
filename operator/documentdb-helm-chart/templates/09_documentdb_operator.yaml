apiVersion: apps/v1
kind: Deployment
metadata:
  name: documentdb-operator
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "documentdb-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: "Helm"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: documentdb-operator
        image: "{{ include "documentdb.imageRef" (dict "name" "image.documentdbk8soperator.repository" "registry" .Values.image.registry "repo" .Values.image.documentdbk8soperator.repository "tag" (.Values.image.documentdbk8soperator.tag | default .Chart.AppVersion)) }}"
        imagePullPolicy: "{{ .Values.image.documentdbk8soperator.pullPolicy }}"
        {{- with .Values.operator.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.operator.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        args:
        - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        # Readiness probe gates the Service endpoint so the API server cannot
        # route webhook requests until the TLS cert is loaded (CNPG pattern).
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        startupProbe:
          httpGet:
            path: /readyz
            port: health
          failureThreshold: 30
          periodSeconds: 2
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: webhook-cert
          readOnly: true
        env:
        - name: GATEWAY_PORT
          value: "10260"
        - name: DOCUMENTDB_GATEWAY_MEMORY_FRACTION
          value: "{{ .Values.operator.sidecarResources.gatewayMemoryFraction }}"
        - name: DOCUMENTDB_GATEWAY_MEMORY_CAP
          value: "{{ .Values.operator.sidecarResources.gatewayMemoryCap }}"
        {{- if .Values.operator.sidecarResources.gatewayCpuLimit }}
        - name: DOCUMENTDB_GATEWAY_CPU_LIMIT
          value: "{{ .Values.operator.sidecarResources.gatewayCpuLimit }}"
        {{- end }}
        - name: DOCUMENTDB_OTEL_MEMORY_REQUEST
          value: "{{ .Values.operator.sidecarResources.otelMemoryRequest }}"
        - name: DOCUMENTDB_OTEL_MEMORY_LIMIT
          value: "{{ .Values.operator.sidecarResources.otelMemoryLimit }}"
        - name: DOCUMENTDB_OTEL_CPU_REQUEST
          value: "{{ .Values.operator.sidecarResources.otelCpuRequest }}"
        {{- if .Values.operator.sidecarResources.otelCpuLimit }}
        - name: DOCUMENTDB_OTEL_CPU_LIMIT
          value: "{{ .Values.operator.sidecarResources.otelCpuLimit }}"
        {{- end }}
        {{- if .Values.documentDbVersion }}
        - name: DOCUMENTDB_VERSION
          value: "{{ .Values.documentDbVersion }}"
        {{- end }}
        # Data-plane image repositories (host+path). The operator composes the
        # final extension/gateway image using DOCUMENTDB_VERSION as the tag.
        {{- if .Values.image.documentdb.repository }}
        - name: DOCUMENTDB_EXTENSION_IMAGE_REPO
          value: "{{ include "documentdb.imageRef" (dict "name" "image.documentdb.repository" "registry" .Values.image.registry "repo" .Values.image.documentdb.repository "tag" "") }}"
        {{- end }}
        {{- /* Guarded: `helm upgrade --reuse-values` from a chart without this map leaves it unset. */}}
        {{- $combined := .Values.image.documentdbCombined | default dict }}
        {{- if $combined.repository }}
        - name: DOCUMENTDB_COMBINED_IMAGE_REPO
          value: "{{ include "documentdb.imageRef" (dict "name" "image.documentdbCombined.repository" "registry" .Values.image.registry "repo" $combined.repository "tag" "") }}"
        {{- end }}
        {{- if .Values.imageMode }}
        {{- if not (has .Values.imageMode (list "auto" "imageVolume" "combined")) }}
        {{- fail (printf "imageMode must be one of auto, imageVolume, combined (got %q)" .Values.imageMode) }}
        {{- end }}
        - name: DOCUMENTDB_IMAGE_MODE
          value: "{{ .Values.imageMode }}"
        {{- end }}
        {{- if .Values.image.gateway.repository }}
        - name: GATEWAY_IMAGE_REPO
          value: "{{ include "documentdb.imageRef" (dict "name" "image.gateway.repository" "registry" .Values.image.registry "repo" .Values.image.gateway.repository "tag" "") }}"
        {{- end }}
        # Extra images: composed via the same registry-prefix rule. The
        # repository and tag must be set together (both or neither); otherwise
        # the operator uses its compiled-in default (otel) or defers to CNPG
        # (postgres).
        {{- $otelImage := include "documentdb.extraImageRef" (dict "registry" .Values.image.registry "repo" .Values.image.otelCollector.repository "tag" .Values.image.otelCollector.tag "repoName" "image.otelCollector.repository" "tagName" "image.otelCollector.tag") }}
        {{- if $otelImage }}
        - name: OTEL_COLLECTOR_IMAGE
          value: "{{ $otelImage }}"
        {{- end }}
        {{- $postgresImage := include "documentdb.extraImageRef" (dict "registry" .Values.image.registry "repo" .Values.image.postgres.repository "tag" .Values.image.postgres.tag "repoName" "image.postgres.repository" "tagName" "image.postgres.tag") }}
        {{- if $postgresImage }}
        - name: POSTGRES_IMAGE
          value: "{{ $postgresImage }}"
        {{- end }}
        {{- $gwPolicy := include "documentdb.pullPolicy" (dict "name" "image.gateway.pullPolicy" "policy" .Values.image.gateway.pullPolicy) }}
        {{- if $gwPolicy }}
        - name: GATEWAY_IMAGE_PULL_POLICY
          value: "{{ $gwPolicy }}"
        {{- end }}
        {{- $ddbPolicy := include "documentdb.pullPolicy" (dict "name" "image.documentdb.pullPolicy" "policy" .Values.image.documentdb.pullPolicy) }}
        {{- if $ddbPolicy }}
        - name: DOCUMENTDB_IMAGE_PULL_POLICY
          value: "{{ $ddbPolicy }}"
        {{- end }}
        {{- if .Values.operator.ioUring.seccompProfile }}
        - name: DOCUMENTDB_IOURING_SECCOMP_PROFILE
          value: "{{ .Values.operator.ioUring.seccompProfile }}"
        {{- end }}
      volumes:
      - name: webhook-cert
        secret:
          secretName: documentdb-webhook-tls
          defaultMode: 420
          # Allow the pod to start before cert-manager creates the Secret.
          # The webhook server (and readiness probe) will stay unhealthy until
          # the cert files appear, keeping the pod out of the Service endpoints.
          optional: true
