{{- $proxy := include "documentdb.proxy" . | fromJson }}
{{- if $proxy.isProxyEnabled }}
# Outbound proxy routing configuration. The keys are the exact environment
# variable names consumed by the operator (via envFrom) and, through plugin
# parameters, by the OTel Collector sidecar injected into each DocumentDB pod. The collector's Go
# runtime reads these natively (http.ProxyFromEnvironment), so the OTLP
# exporter's egress is routed through the proxy with no image change.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "documentdb.proxySecretName" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "documentdb-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: "Helm"
type: Opaque
stringData:
  DOCUMENTDB_OTEL_HTTP_PROXY: {{ $proxy.httpProxy | quote }}
  DOCUMENTDB_OTEL_HTTPS_PROXY: {{ $proxy.httpsProxy | quote }}
  DOCUMENTDB_OTEL_NO_PROXY: {{ include "documentdb.noProxy" . | quote }}
{{- end }}
